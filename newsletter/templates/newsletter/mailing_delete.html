{% extends 'newsletter/base.html' %}
{% block title %}Удаление рассылки{% endblock %}
{% block content %}
<div class="container mt-5">
    <div class="card">
        <div class="card-header">
            <h3>Подтверждение удаления</h3>
        </div>
        <div class="card-body">
            <p>Вы уверены, что хотите удалить рассылку?</p>
            <p><strong>Сообщение:</strong> {{ object.message.title }}</p>
            <p><strong>Статус:</strong> {{ object.get_status_display }}</p>

            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Удалить</button>
                <a href="{% url 'newsletter:mailing_detail' object.pk %}" class="btn btn-secondary">Отмена</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
