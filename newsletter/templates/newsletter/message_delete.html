{% extends 'newsletter/base.html' %}
{% block title %}Удаление сообщения{% endblock %}
{% block content %}
<div class="container mt-5">
    <h2>Подтверждение удаления</h2>
    <p>Вы уверены, что хотите удалить сообщение "{{ object.title }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Удалить</button>
        <a href="{% url 'newsletter:message_list' %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
