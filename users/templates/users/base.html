<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}{% endblock %}</title>
</head>
<body>
    <div>
        {% if user.is_authenticated %}
            Привет, {{ user.username }}!
            <a href="{% url 'logout' %}">Выйти</a>
        {% else %}
            <a href="{% url 'login' %}">Войти</a> |
            <a href="{% url 'signup' %}">Регистрация</a>
        {% endif %}
    </div>
    {% block content %}{% endblock %}
</body>
</html>
