{% extends 'newsletter/base.html' %}
{% block title %}Главная страница{% endblock %}
{% block content %}
<section class="py-5 text-center container">
    <div class="col-lg-6 col-md-8 mx-auto"><h1 class="fw-light">Статистика рассылок</h1></div>
</section>
<section class="py-5 text-center container">
    <div class="col-lg-6 col-md-8 mx-auto"><h1 class="fw-light">{{ object.name }}</h1>
        <p class="lead text-body-secondary">Всего рассылок: {{ mailing_list }}</p>
        <p class="lead text-body-secondary">Активных рассылок: {{ active_mailing_list}}</p>
        <p class="lead text-body-secondary">Уникальных получателей: {{ unique_recipient }}</p>
    </div>
</section>
{% endblock %}
