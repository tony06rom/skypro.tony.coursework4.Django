{% extends 'newsletter/base.html' %}
{% block title %}Новое сообщение{% endblock %}
{% block content %}
<div class="container mt-5">
    <h2>{% if object %}Редактирование{% else %}Создание{% endif %} сообщения</h2>
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label for="id_title" class="form-label">Тема письма</label>
            <input type="text" class="form-control" id="id_title"
                   name="title" value="{{ form.title.value|default:'' }}" required>
        </div>
        <div class="mb-3">
            <label for="id_body" class="form-label">Текст письма</label>
            <textarea class="form-control" id="id_body" name="body"
                      rows="5" required>{{ form.body.value|default:'' }}</textarea>
        </div>
        <button type="submit" class="btn btn-primary">Сохранить</button>
        <a href="{% url 'newsletter:mailing_list' %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
