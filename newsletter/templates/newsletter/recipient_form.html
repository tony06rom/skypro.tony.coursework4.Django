{% extends 'newsletter/base.html' %}
{% block title %}Форма получателя{% endblock %}
{% block content %}
<div class="container mt-5">
    <h2>{% if object %}Редактирование{% else %}Создание{% endif %} получателя</h2>
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">ФИО</label>
            <input type="text" class="form-control" name="full_name"
                   value="{{ form.full_name.value|default:'' }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" name="email"
                   value="{{ form.email.value|default:'' }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Комментарий</label>
            <textarea class="form-control" name="comment" rows="3">{{ form.comment.value|default:'' }}</textarea>
        </div>
        <button type="submit" class="btn btn-primary">Сохранить</button>
        <a href="{% url 'newsletter:recipient_list' %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
